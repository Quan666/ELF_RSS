[tool.poetry]
name = "ELF_RSS"
version = "2.6.25"
description = "QQ机器人 RSS订阅 插件，订阅源建议选择 RSSHub"
authors = ["Quan666 <i@Rori.eMail>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [
    { include = "ELF_RSS2", from = "src/plugins" },
]
homepage = "https://github.com/Quan666/ELF_RSS"
repository = "https://github.com/Quan666/ELF_RSS"
keywords = ["nonebot", "nonebot2", "rss" ,"elf" ,"rsshub"]

[tool.poetry.dependencies]
python = ">=3.14.7,<4.0"
aiohttp = {extras = ["speedups"], version = "^3.14.3"}
arrow = "^1.4.0"
async-timeout = "^5.0.1"
bbcode = "^1.1.0"
cachetools = "^5.5.2"
emoji = "^2.15.0"
feedparser = "^6.0.14"
deep-translator = "^1.11.4"
ImageHash = "^4.3.2"
magneturi = "^1.3"
nonebot-adapter-onebot = "^2.4.6"
nonebot-plugin-apscheduler = "^0.5.0"
nonebot2 = {extras = ["fastapi"], version = "^2.5.0"}
pikpakapi = "^0.1.11"
Pillow = "^10.4.0"
pydantic = ">=1.10.26,<3.0.0,!=2.5.0,!=2.5.1"
pyquery = "^2.1.0"
python-qbittorrent = "^0.4.3"
tenacity = "^8.5.0"
tinydb = "^4.9.0"
yarl = "^1.24.5"

[tool.poetry.group.dev.dependencies]
nb-cli = "^1.7.4"

[tool.mypy]
python_version = "3.10"
plugins = [
    "pydantic.mypy"
]
ignore_missing_imports = true
implicit_reexport = true
pretty = true
show_error_codes = true
strict = true

[tool.ruff]
select = ["F", "E", "W", "I", "UP"]
target-version = "py310"
line-length = 120

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"*.py" = ["E402", "F811"]

[build-system]
requires = ["poetry-core>=1.9.1"]
build-backend = "poetry.core.masonry.api"
